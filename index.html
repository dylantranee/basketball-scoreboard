<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Basketball Scoreboard</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <div class="scoreboard">
            <div class="container">
                <div class="scoreboard-flex">
                    <div class="home">
                        <h2 class="scoreboard-title">Home</h2>
                        <p class="scoreboard-score" id="home-score">0</p>
                        <div class="btn-scores-list">
                            <button class="btn btn-score" data-team="home" data-points="1" aria-label="Plus 1 score for the home">+1</button>
                            <button class="btn btn-score" data-team="home" data-points="2" aria-label="Plus 2 score for the home">+2</button>
                            <button class="btn btn-score" data-team="home" data-points="3" aria-label="Plus 3 score for the home">+3</button>
                        </div>
                    </div>

                    <div class="guest">
                        <h2 class="scoreboard-title">Guest</h2>
                        <p class="scoreboard-score" id="guest-score">0</p>
                        <div class="btn-scores-list">
                            <button class="btn btn-score" data-team="guest" data-points="1" aria-label="Plus 1 score for the guest">+1</button>
                            <button class="btn btn-score" data-team="guest" data-points="2" aria-label="Plus 2 score for the guest">+2</button>
                            <button class="btn btn-score" data-team="guest" data-points="3" aria-label="Plus 3 score for the guest">+3</button>
                        </div>
                    </div>
                </div>

                <button class="btn btn-new-game" id="new-game" aria-label="Start a new game">New game</button>
            </div>
        </div>
            
        <script src="script.js"></script>
    </body>
</html>
